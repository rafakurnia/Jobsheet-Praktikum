<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan 24 &amp; 25 — Product Explorer</title>
</head>
<body>
  <h1>Daftar Produk</h1>

  <div id="status-area"></div>
  <div id="product-grid"></div>

  <h2>Statistik</h2>
  <div id="stats-area"></div>

  <h2>Analitik per Kategori</h2>
  <div id="category-area"></div>

  <h2>Cari Produk</h2>
  <input id="search-input" type="text" placeholder="Ketik keyword...">
  <select id="search-mode">
    <option value="partial">Partial (mengandung)</option>
    <option value="exact">Exact (persis sama)</option>
    <option value="caseInsensitive">Case-insensitive (persis, abaikan huruf besar/kecil)</option>
  </select>
  <button onclick="handleSearch()">Cari</button>
  <div id="search-results"></div>

  <script src="app.js"></script>
</body>
</html>
